services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_SECRET: ${SESSION_SECRET:?Définissez SESSION_SECRET dans .env}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-nexus_net}
      DB_USER: ${DB_USER:-nexus}
      DB_PASS: ${DB_PASS:?Définissez DB_PASS dans .env}
      DB_CONNECT_RETRY_MS: ${DB_CONNECT_RETRY_MS:-2000}
    # Nécessaire UNIQUEMENT pour la gestion Docker depuis l'interface.
    # Donne un accès root équivalent à l'hôte : à retirer si non utilisé,
    # ou passer par un proxy filtrant (ex: tecnativa/docker-socket-proxy).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définissez MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: ${DB_NAME:-nexus_net}
      MYSQL_USER: ${DB_USER:-nexus}
      MYSQL_PASSWORD: ${DB_PASS:?Définissez DB_PASS dans .env}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
